name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.mjs
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Собрать публичную папку (без тестов и служебных файлов)
        run: |
          mkdir _site
          cp index.html style.css app.js access.js anatomy.js billing.js calib.js config.js ctx.js engine.js figures.js help-view.js help.js hypo-view.js hypo.js paywall.js pricing.js proapi.js quiz.js services.js sheets.js store.js ui-pro-text.js ui-text.js chitay_pro.json chitay_calib.json chitay_hypo.json chitay_quiz.json .nojekyll _site/
          if ls assets/*.webp >/dev/null 2>&1; then mkdir _site/assets && cp assets/*.webp _site/assets/; fi
          if ls assets/fonts/*.woff2 >/dev/null 2>&1; then mkdir -p _site/assets/fonts && cp assets/fonts/*.woff2 _site/assets/fonts/; fi
          # платный контент (chitay_server/content/pro_content.json) и chitay_pro_full.json сюда не попадают
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
